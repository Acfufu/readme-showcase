name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  legacy-all:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    env:
      README_SHOWCASE_SKIP_NODE: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --disable-pip-version-check jsonschema==4.26.0
      - run: python -m py_compile skill/scripts/*.py scripts/*.py
      - run: time python -m unittest discover -s tests -v
      - run: python skill/scripts/readme_pipeline.py validate-dataset --manifest dataset/retrieval/manifest.json
      - run: python skill/scripts/audit_readme.py README.md
      - run: python skill/scripts/audit_readme.py README_zh.md

  npm-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22.22.3"
          cache: npm
      - run: npm ci --ignore-scripts
      - run: python -m unittest tests.test_installer.InstallerTests.test_packed_npm_binary_installs_and_checks_skill -v
      - run: npm pack --dry-run

  elk-unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22.22.3"
          cache: npm
      - run: npm ci --ignore-scripts
      - run: cmp node_modules/elkjs/lib/elk.bundled.js skill/vendor/elkjs/lib/elk.bundled.js
      - run: cmp node_modules/elkjs/package.json skill/vendor/elkjs/package.json
      - run: cmp node_modules/elkjs/LICENSE.md skill/vendor/elkjs/LICENSE.md
      - run: node --check skill/scripts/render_elk.mjs
      - run: python -m unittest tests.test_elk_adapter tests.test_pipeline_e2e -v

  motion:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13"
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg librsvg2-bin
      - run: python -m pip install --disable-pip-version-check Pillow==11.3.0
      - run: >-
          python skill/scripts/render_motion_gif.py
          assets/readme/hero.svg
          "${RUNNER_TEMP}/hero.gif"
          --spec assets/readme/hero-motion.json
      - run: test -s "${RUNNER_TEMP}/hero.gif"

  real-elk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22.22.3"
          cache: npm
      - name: Verify vendored ELK and render without network
        shell: bash
        run: |
          set -euo pipefail
          npm ci --ignore-scripts
          cmp node_modules/elkjs/lib/elk.bundled.js skill/vendor/elkjs/lib/elk.bundled.js
          cmp node_modules/elkjs/package.json skill/vendor/elkjs/package.json
          cmp node_modules/elkjs/LICENSE.md skill/vendor/elkjs/LICENSE.md
          test "$(sha256sum skill/vendor/elkjs/lib/elk.bundled.js | cut -d' ' -f1)" = "b0745abd7f23cd91690a1587e377edbe19fd7233c783300290936720546216d4"
          EVIDENCE_ROOT="${RUNNER_TEMP}/elk-evidence"
          NODE_BIN="$(command -v node)"
          RUNNER_UID="$(id -u)"
          RUNNER_GID="$(id -g)"
          mkdir -p "${EVIDENCE_ROOT}"
          printf 'node_version=%s\nmodule_sha256=%s\nnetwork=unshare-net\n' \
            "$(node -p 'process.versions.node')" \
            "$(sha256sum skill/vendor/elkjs/lib/elk.bundled.js | cut -d' ' -f1)" \
            > "${EVIDENCE_ROOT}/runtime.txt"
          for kind in architecture flowchart c4; do
            KIND_ROOT="${EVIDENCE_ROOT}/${kind}"
            mkdir "${KIND_ROOT}"
            cp "tests/fixtures/elk/${kind}.json" "${KIND_ROOT}/${kind}.diagram.json"
            sudo unshare --net --setuid "${RUNNER_UID}" --setgid "${RUNNER_GID}" -- \
              "${NODE_BIN}" "${GITHUB_WORKSPACE}/skill/scripts/render_elk.mjs" \
                --input "${KIND_ROOT}/${kind}.diagram.json" \
                --output "${KIND_ROOT}/${kind}.svg" \
                --metadata "${KIND_ROOT}/${kind}.engine.json"
          done
          PYTHONDONTWRITEBYTECODE=1 python - "${EVIDENCE_ROOT}" "${GITHUB_WORKSPACE}" <<'PY'
          import hashlib
          import json
          import sys
          from pathlib import Path

          evidence_root = Path(sys.argv[1])
          repository = Path(sys.argv[2])
          sys.path.insert(0, str(repository))
          from skill.scripts.audit_readme import audit_svg_bytes

          digest = lambda raw: hashlib.sha256(raw).hexdigest()
          kinds = ("architecture", "flowchart", "c4")
          expected_files = {
              "runtime.txt",
              *{
                  f"{kind}/{kind}.{suffix}"
                  for kind in kinds
                  for suffix in ("diagram.json", "svg", "engine.json")
              },
          }
          observed = {
              path.relative_to(evidence_root).as_posix()
              for path in evidence_root.rglob("*")
              if path.is_file()
          }
          if observed != expected_files:
              raise SystemExit("ELK evidence file allowlist failed")
          for kind in kinds:
              directory = evidence_root / kind
              input_raw = (directory / f"{kind}.diagram.json").read_bytes()
              expected_input = (repository / "tests/fixtures/elk" / f"{kind}.json").read_bytes()
              svg_raw = (directory / f"{kind}.svg").read_bytes()
              metadata = json.loads((directory / f"{kind}.engine.json").read_bytes())
              semantic = json.loads(input_raw)
              labels = [
                  *[item["label"] for item in semantic["groups"]],
                  *[item["label"] for item in semantic["nodes"]],
                  *[item["label"] for item in semantic["edges"] if item["label"] is not None],
              ]
              issues = audit_svg_bytes(
                  svg_raw,
                  expected_title=semantic["accessibility_title"],
                  expected_labels=labels,
              )
              output_sha256 = digest(svg_raw)
              if input_raw != expected_input or issues:
                  raise SystemExit(f"{kind} semantic or SVG verification failed: {issues}")
              if (
                  metadata["package_name"] != "elkjs"
                  or metadata["package_version"] != "0.9.3"
                  or metadata["license_spdx"] != "EPL-2.0"
                  or metadata["node_version"] != "22.22.3"
                  or metadata["input_sha256"] != digest(input_raw)
                  or metadata["output_sha256"] != output_sha256
                  or metadata["run_hashes"] != [output_sha256, output_sha256]
                  or metadata["validation"] != "pass"
              ):
                  raise SystemExit(f"{kind} metadata verification failed")
          PY
          git diff --exit-code
          test -z "$(git status --porcelain)"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: elk-real-engine-evidence
          if-no-files-found: error
          path: ${{ runner.temp }}/elk-evidence
