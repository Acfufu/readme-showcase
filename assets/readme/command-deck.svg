<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500" viewBox="0 0 1200 500" role="img" aria-labelledby="title desc" data-readme-language="en">
  <title id="title">README Showcase command deck</title>
  <desc id="desc">Five commands route planning, audit, redesign, polish, and visualization into bounded README work.</desc>
  <defs><pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#171713" stroke-opacity=".05"/></pattern></defs>
  <rect width="1200" height="500" rx="28" fill="#F3EFE6"/><rect width="1200" height="500" rx="28" fill="url(#grid)"/>
  <circle cx="45" cy="43" r="9" fill="#E65036"/><text x="68" y="50" font-family="SFMono-Regular,Menlo,monospace" font-size="17" font-weight="700" letter-spacing="2" fill="#171713">COMMAND DECK</text>
  <text x="1150" y="50" text-anchor="end" font-family="SFMono-Regular,Menlo,monospace" font-size="14" fill="#716E65">ONE SKILL · FIVE JOBS</text>
  <path d="M0 82H1200" stroke="#171713" stroke-width="2"/>
  <text x="48" y="139" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Arial,PingFang SC,sans-serif" font-size="38" font-weight="800" letter-spacing="-1.5" fill="#171713">Choose the job. Keep the boundary.</text>
  <g font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Arial,PingFang SC,sans-serif">
    <g transform="translate(48 174)"><rect width="208" height="244" rx="16" fill="#171713"/><text x="18" y="42" font-family="SFMono-Regular,Menlo,monospace" font-size="14" fill="#D7F45B">01 · PLAN</text><text x="18" y="90" font-size="29" font-weight="800" fill="#FFFDF8">shape</text><text x="18" y="128" font-size="16" fill="#BDB8AE">Evidence map</text><text x="18" y="153" font-size="16" fill="#BDB8AE">Narrative</text><text x="18" y="178" font-size="16" fill="#BDB8AE">Visual direction</text><rect x="18" y="202" width="172" height="27" rx="6" fill="#2A2A26"/><text x="104" y="221" text-anchor="middle" font-family="SFMono-Regular,Menlo,monospace" font-size="12" fill="#D7F45B">STOP FOR APPROVAL</text></g>
    <g transform="translate(272 174)"><rect width="208" height="244" rx="16" fill="#FFFDF8" stroke="#171713" stroke-width="2"/><text x="18" y="42" font-family="SFMono-Regular,Menlo,monospace" font-size="14" fill="#E65036">02 · INSPECT</text><text x="18" y="90" font-size="29" font-weight="800" fill="#171713">audit</text><text x="18" y="128" font-size="16" fill="#716E65">Claims</text><text x="18" y="153" font-size="16" fill="#716E65">Links + locale</text><text x="18" y="178" font-size="16" fill="#716E65">Hard findings</text><rect x="18" y="202" width="172" height="27" rx="6" fill="#F5D7D1"/><text x="104" y="221" text-anchor="middle" font-family="SFMono-Regular,Menlo,monospace" font-size="12" fill="#A53120">READ ONLY</text></g>
    <g transform="translate(496 174)"><rect width="208" height="244" rx="16" fill="#167C72"/><text x="18" y="42" font-family="SFMono-Regular,Menlo,monospace" font-size="14" fill="#D8EEE9">03 · REBUILD</text><text x="18" y="90" font-size="29" font-weight="800" fill="#FFFDF8">redesign</text><text x="18" y="128" font-size="16" fill="#D8EEE9">Story order</text><text x="18" y="153" font-size="16" fill="#D8EEE9">Copy + visuals</text><text x="18" y="178" font-size="16" fill="#D8EEE9">Hard gates</text><rect x="18" y="202" width="172" height="27" rx="6" fill="#0D6058"/><text x="104" y="221" text-anchor="middle" font-family="SFMono-Regular,Menlo,monospace" font-size="12" fill="#FFFDF8">LOCAL PREVIEW</text></g>
    <g transform="translate(720 174)"><rect width="208" height="244" rx="16" fill="#FFFDF8" stroke="#171713" stroke-width="2"/><text x="18" y="42" font-family="SFMono-Regular,Menlo,monospace" font-size="14" fill="#2356B6">04 · REFINE</text><text x="18" y="90" font-size="29" font-weight="800" fill="#171713">polish</text><text x="18" y="128" font-size="16" fill="#716E65">Narrow scope</text><text x="18" y="153" font-size="16" fill="#716E65">Keep identity</text><text x="18" y="178" font-size="16" fill="#716E65">Validate diff</text><rect x="18" y="202" width="172" height="27" rx="6" fill="#DDE7FA"/><text x="104" y="221" text-anchor="middle" font-family="SFMono-Regular,Menlo,monospace" font-size="12" fill="#2356B6">NO HIDDEN REDESIGN</text></g>
    <g transform="translate(944 174)"><rect width="208" height="244" rx="16" fill="#E65036"/><text x="18" y="42" font-family="SFMono-Regular,Menlo,monospace" font-size="14" fill="#FFFDF8">05 · DRAW</text><text x="18" y="90" font-size="29" font-weight="800" fill="#FFFDF8">visualize</text><text x="18" y="128" font-size="16" fill="#F9DED8">Hero + diagram</text><text x="18" y="153" font-size="16" fill="#F9DED8">Static + motion</text><text x="18" y="178" font-size="16" fill="#F9DED8">Asset QA</text><rect x="18" y="202" width="172" height="27" rx="6" fill="#C53E27"/><text x="104" y="221" text-anchor="middle" font-family="SFMono-Regular,Menlo,monospace" font-size="12" fill="#FFFDF8">EMBED SEPARATELY</text></g>
  </g>
  <text x="48" y="466" font-family="SFMono-Regular,Menlo,monospace" font-size="13" fill="#716E65">$readme-showcase [command] [target]</text><text x="1152" y="466" text-anchor="end" font-family="SFMono-Regular,Menlo,monospace" font-size="13" font-weight="700" fill="#E65036">NO COMMAND GRANTS REMOTE AUTHORITY</text>
</svg>
