<svg xmlns="http://www.w3.org/2000/svg"
     width="1200" height="500" viewBox="0 0 1200 500"
     data-readme-language="en"
     role="img" aria-labelledby="title desc">
  <title id="title">README Showcase evidence rail</title>
  <desc id="desc">Repository evidence moves through scan, retrieval, drafting, evaluation, and a local handoff; remote publishing stays locked behind separate approval.</desc>

  <rect width="1200" height="500" rx="28" fill="#F4F7FB"/>
  <rect x="22" y="22" width="1156" height="456" rx="20" fill="#FFFFFF" stroke="#C9D5E3" stroke-width="2"/>

  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif">
    <text x="56" y="68" fill="#52677F" font-size="18" font-weight="800" letter-spacing="2">EVIDENCE RAIL / LOCAL PIPELINE</text>
    <text x="56" y="116" fill="#0B1727" font-size="38" font-weight="800">Every public claim keeps its source.</text>
    <rect x="906" y="52" width="238" height="44" rx="22" fill="#FFF1D2"/>
    <text x="1025" y="81" fill="#9A6200" font-size="18" font-weight="800" text-anchor="middle">NO APPROVAL · NO PUSH</text>

    <path d="M112 221H1002" stroke="#9DB0C4" stroke-width="4"/>
    <path d="m992 211 12 10-12 10" fill="none" stroke="#9DB0C4" stroke-width="4"/>

    <g id="stages">
      <g transform="translate(56 174)">
        <circle cx="56" cy="47" r="38" fill="#0B1727"/>
        <text x="56" y="54" fill="#FFFFFF" font-size="22" font-weight="800" text-anchor="middle">01</text>
        <text x="56" y="112" fill="#0B1727" font-size="21" font-weight="800" text-anchor="middle">SCAN</text>
        <text x="56" y="139" fill="#52677F" font-size="18" text-anchor="middle">Repository facts</text>
      </g>

      <g transform="translate(266 174)">
        <circle cx="56" cy="47" r="38" fill="#123E3B"/>
        <text x="56" y="54" fill="#FFFFFF" font-size="22" font-weight="800" text-anchor="middle">02</text>
        <text x="56" y="112" fill="#0B1727" font-size="21" font-weight="800" text-anchor="middle">RETRIEVE</text>
        <text x="56" y="139" fill="#52677F" font-size="18" text-anchor="middle">Train patterns only</text>
      </g>

      <g transform="translate(476 174)">
        <circle cx="56" cy="47" r="38" fill="#123E3B"/>
        <text x="56" y="54" fill="#FFFFFF" font-size="22" font-weight="800" text-anchor="middle">03</text>
        <text x="56" y="112" fill="#0B1727" font-size="21" font-weight="800" text-anchor="middle">DRAFT</text>
        <text x="56" y="139" fill="#52677F" font-size="18" text-anchor="middle">Copy + visuals</text>
      </g>

      <g transform="translate(686 174)">
        <circle cx="56" cy="47" r="38" fill="#123E3B"/>
        <text x="56" y="54" fill="#FFFFFF" font-size="22" font-weight="800" text-anchor="middle">04</text>
        <text x="56" y="112" fill="#0B1727" font-size="21" font-weight="800" text-anchor="middle">EVALUATE</text>
        <text x="56" y="139" fill="#52677F" font-size="18" text-anchor="middle">Claims + assets</text>
      </g>

      <g transform="translate(896 174)">
        <circle cx="56" cy="47" r="38" fill="#0B1727"/>
        <text x="56" y="54" fill="#FFFFFF" font-size="22" font-weight="800" text-anchor="middle">05</text>
        <text x="56" y="112" fill="#0B1727" font-size="21" font-weight="800" text-anchor="middle">HANDOFF</text>
        <text x="56" y="139" fill="#52677F" font-size="18" text-anchor="middle">Fingerprint bundle</text>
      </g>
    </g>

    <g id="artifacts" transform="translate(56 366)">
      <rect width="198" height="72" rx="12" fill="#EDF3F8"/>
      <text x="18" y="30" fill="#52677F" font-size="17" font-weight="700">TRUTH</text>
      <text x="18" y="55" fill="#0B1727" font-size="20" font-weight="800">claim-map.json</text>

      <rect x="216" width="198" height="72" rx="12" fill="#EDF3F8"/>
      <text x="234" y="30" fill="#52677F" font-size="17" font-weight="700">VISUALS</text>
      <text x="234" y="55" fill="#0B1727" font-size="20" font-weight="800">asset-manifest</text>

      <rect x="432" width="198" height="72" rx="12" fill="#EDF3F8"/>
      <text x="450" y="30" fill="#52677F" font-size="17" font-weight="700">GATES</text>
      <text x="450" y="55" fill="#0B1727" font-size="20" font-weight="800">evaluation report</text>

      <rect x="648" width="222" height="72" rx="12" fill="#DDF7F3"/>
      <text x="666" y="30" fill="#39756F" font-size="17" font-weight="700">LOCAL RESULT</text>
      <text x="666" y="55" fill="#0B1727" font-size="20" font-weight="800">PR bundle · PASS</text>

      <rect x="888" width="200" height="72" rx="12" fill="#FFF1D2"/>
      <text x="906" y="30" fill="#9A6200" font-size="17" font-weight="700">REMOTE WRITE</text>
      <text x="906" y="55" fill="#6D4700" font-size="20" font-weight="800">Separate approval</text>
    </g>
  </g>
</svg>
