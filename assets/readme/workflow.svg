<svg xmlns="http://www.w3.org/2000/svg"
     width="1200" height="620" viewBox="0 0 1200 620"
     role="img" aria-labelledby="title desc">
  <title id="title">README Showcase evidence-driven workflow</title>
  <desc id="desc">Five stages move from repository evidence through project type, narrative, presentation, and runnable verification, with gates that reject unsupported claims, decorative visuals, and unauthorized publishing.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#58A6FF"/>
    </marker>
  </defs>

  <rect width="1200" height="620" rx="28" fill="#0D1117"/>
  <rect x="36" y="34" width="1128" height="552" rx="22"
        fill="#161B22" stroke="#30363D" stroke-width="2"/>

  <g id="title-block" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
    <text x="68" y="82" fill="#8B949E" font-size="20" font-weight="600"
          letter-spacing="2">README SHOWCASE · WORKFLOW</text>
    <text x="68" y="132" fill="#F0F6FC" font-size="42" font-weight="700">
      证据驱动的 README 工作流
    </text>
    <text x="68" y="168" fill="#8B949E" font-size="22">
      Evidence first. Presentation second. Verification closes the loop.
    </text>
    <rect x="903" y="72" width="217" height="52" rx="26"
          fill="#0D1117" stroke="#58A6FF" stroke-width="2"/>
    <text x="1011" y="106" fill="#79C0FF" font-size="20"
          font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
          text-anchor="middle">$readme-showcase</text>
  </g>

  <g id="workflow" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
    <line x1="244" y1="318" x2="270" y2="318" stroke="#58A6FF"
          stroke-width="4" marker-end="url(#arrow)"/>
    <line x1="454" y1="318" x2="480" y2="318" stroke="#58A6FF"
          stroke-width="4" marker-end="url(#arrow)"/>
    <line x1="664" y1="318" x2="690" y2="318" stroke="#58A6FF"
          stroke-width="4" marker-end="url(#arrow)"/>
    <line x1="874" y1="318" x2="900" y2="318" stroke="#58A6FF"
          stroke-width="4" marker-end="url(#arrow)"/>

    <g id="stage-evidence">
      <rect x="60" y="230" width="184" height="176" rx="18"
            fill="#0D1117" stroke="#238636" stroke-width="2"/>
      <circle cx="92" cy="263" r="18" fill="#238636"/>
      <text x="92" y="270" fill="#FFFFFF" font-size="19" font-weight="700"
            text-anchor="middle">1</text>
      <text x="86" y="316" fill="#F0F6FC" font-size="30" font-weight="700">仓库证据</text>
      <text x="86" y="348" fill="#8B949E" font-size="18">Repository evidence</text>
      <text x="86" y="378" fill="#7EE787" font-size="18">价值 · 证明 · 边界</text>
    </g>

    <g id="stage-type">
      <rect x="270" y="230" width="184" height="176" rx="18"
            fill="#0D1117" stroke="#1F6FEB" stroke-width="2"/>
      <circle cx="302" cy="263" r="18" fill="#1F6FEB"/>
      <text x="302" y="270" fill="#FFFFFF" font-size="19" font-weight="700"
            text-anchor="middle">2</text>
      <text x="296" y="316" fill="#F0F6FC" font-size="30" font-weight="700">项目类型</text>
      <text x="296" y="348" fill="#8B949E" font-size="18">Project type</text>
      <text x="296" y="378" fill="#79C0FF" font-size="18">Agent Skill · CLI · App</text>
    </g>

    <g id="stage-narrative">
      <rect x="480" y="230" width="184" height="176" rx="18"
            fill="#0D1117" stroke="#8957E5" stroke-width="2"/>
      <circle cx="512" cy="263" r="18" fill="#8957E5"/>
      <text x="512" y="270" fill="#FFFFFF" font-size="19" font-weight="700"
            text-anchor="middle">3</text>
      <text x="506" y="316" fill="#F0F6FC" font-size="30" font-weight="700">章节叙事</text>
      <text x="506" y="348" fill="#8B949E" font-size="18">Narrative</text>
      <text x="506" y="378" fill="#D2A8FF" font-size="18">价值 → 证明 → 成功</text>
    </g>

    <g id="stage-presentation">
      <rect x="690" y="230" width="184" height="176" rx="18"
            fill="#0D1117" stroke="#D29922" stroke-width="2"/>
      <circle cx="722" cy="263" r="18" fill="#D29922"/>
      <text x="722" y="270" fill="#FFFFFF" font-size="19" font-weight="700"
            text-anchor="middle">4</text>
      <text x="716" y="316" fill="#F0F6FC" font-size="30" font-weight="700">展示形式</text>
      <text x="716" y="348" fill="#8B949E" font-size="18">Presentation</text>
      <text x="716" y="378" fill="#E3B341" font-size="18">Markdown · SVG · GIF</text>
    </g>

    <g id="stage-verification">
      <rect x="900" y="230" width="240" height="176" rx="18"
            fill="#0D1117" stroke="#F85149" stroke-width="2"/>
      <circle cx="932" cy="263" r="18" fill="#DA3633"/>
      <text x="932" y="270" fill="#FFFFFF" font-size="19" font-weight="700"
            text-anchor="middle">5</text>
      <text x="926" y="316" fill="#F0F6FC" font-size="30" font-weight="700">可运行验证</text>
      <text x="926" y="348" fill="#8B949E" font-size="18">Runnable verification</text>
      <text x="926" y="378" fill="#FF7B72" font-size="18">声明 · 命令 · 链接 · 资产</text>
    </g>
  </g>

  <g id="gates" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
    <text x="68" y="464" fill="#8B949E" font-size="18" font-weight="600"
          letter-spacing="1.5">STOP GATES · 边界</text>
    <rect x="68" y="485" width="330" height="62" rx="14" fill="#21262D"/>
    <text x="90" y="523" fill="#F0F6FC" font-size="20">
      无证据 → 删除公开声明
    </text>
    <rect x="430" y="485" width="330" height="62" rx="14" fill="#21262D"/>
    <text x="452" y="523" fill="#F0F6FC" font-size="20">
      无理解收益 → 保持 Markdown
    </text>
    <rect x="792" y="485" width="330" height="62" rx="14" fill="#21262D"/>
    <text x="814" y="523" fill="#F0F6FC" font-size="20">
      未明确授权 → 不发布、不生成 GIF
    </text>
  </g>
</svg>
