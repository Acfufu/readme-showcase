<svg xmlns="http://www.w3.org/2000/svg"
     width="1200" height="540" viewBox="0 0 1200 540"
     role="img" aria-labelledby="title desc">
  <title id="title">README Showcase evidence workflow</title>
  <desc id="desc">Repository evidence moves through five review desks: inspect, select, draft, visualize, and verify.</desc>

  <rect width="1200" height="540" rx="24" fill="#1D1B17"/>

  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif">
    <text x="54" y="58" fill="#D8D0C2" font-size="18" font-weight="700"
          letter-spacing="3">THE EVIDENCE DESK / WORKFLOW</text>
    <text x="54" y="112" fill="#FFFDF7" font-size="42" font-weight="750">
      Every claim passes five desks.
    </text>
    <text x="1146" y="58" fill="#C54A36" font-size="18" font-weight="800"
          text-anchor="end">NO PROOF, NO CLAIM.</text>

    <line x1="54" y1="146" x2="1146" y2="146" stroke="#686257" stroke-width="2"/>

    <g transform="translate(54 178)">
      <g>
        <text x="0" y="22" fill="#C54A36" font-size="20" font-weight="800">01</text>
        <text x="0" y="63" fill="#FFFDF7" font-size="26" font-weight="700">INSPECT</text>
        <text x="0" y="98" fill="#B9B1A4" font-size="19">Audience</text>
        <text x="0" y="126" fill="#B9B1A4" font-size="19">Value + proof</text>
        <text x="0" y="154" fill="#B9B1A4" font-size="19">Limits</text>
      </g>

      <line x1="180" y1="0" x2="180" y2="190" stroke="#686257"/>
      <g transform="translate(218 0)">
        <text x="0" y="22" fill="#C54A36" font-size="20" font-weight="800">02</text>
        <text x="0" y="63" fill="#FFFDF7" font-size="26" font-weight="700">SELECT</text>
        <text x="0" y="98" fill="#B9B1A4" font-size="19">Project type</text>
        <text x="0" y="126" fill="#B9B1A4" font-size="19">Editing mode</text>
        <text x="0" y="154" fill="#B9B1A4" font-size="19">Sections</text>
      </g>

      <line x1="398" y1="0" x2="398" y2="190" stroke="#686257"/>
      <g transform="translate(436 0)">
        <text x="0" y="22" fill="#C54A36" font-size="20" font-weight="800">03</text>
        <text x="0" y="63" fill="#FFFDF7" font-size="26" font-weight="700">DRAFT</text>
        <text x="0" y="98" fill="#B9B1A4" font-size="19">Value → proof</text>
        <text x="0" y="126" fill="#B9B1A4" font-size="19">Mechanism</text>
        <text x="0" y="154" fill="#B9B1A4" font-size="19">First success</text>
      </g>

      <line x1="616" y1="0" x2="616" y2="190" stroke="#686257"/>
      <g transform="translate(654 0)">
        <text x="0" y="22" fill="#C54A36" font-size="20" font-weight="800">04</text>
        <text x="0" y="63" fill="#FFFDF7" font-size="26" font-weight="700">VISUALIZE</text>
        <text x="0" y="98" fill="#B9B1A4" font-size="19">Markdown first</text>
        <text x="0" y="126" fill="#B9B1A4" font-size="19">SVG as proof</text>
        <text x="0" y="154" fill="#B9B1A4" font-size="19">GIF by opt-in</text>
      </g>

      <line x1="834" y1="0" x2="834" y2="190" stroke="#686257"/>
      <g transform="translate(872 0)">
        <text x="0" y="22" fill="#C54A36" font-size="20" font-weight="800">05</text>
        <text x="0" y="63" fill="#FFFDF7" font-size="26" font-weight="700">VERIFY</text>
        <text x="0" y="98" fill="#B9B1A4" font-size="19">Claims</text>
        <text x="0" y="126" fill="#B9B1A4" font-size="19">Links + assets</text>
        <text x="0" y="154" fill="#B9B1A4" font-size="19">Runnable result</text>
      </g>
    </g>

    <rect x="54" y="408" width="1092" height="82" rx="5"
          fill="#F3EFE5"/>
    <text x="82" y="441" fill="#686257" font-size="16" font-weight="800"
          letter-spacing="2">RELEASE GATES</text>
    <text x="82" y="472" fill="#1D1B17" font-size="20" font-weight="650">
      Unsupported claim → remove
    </text>
    <line x1="416" y1="441" x2="416" y2="475" stroke="#B9B1A4"/>
    <text x="444" y="472" fill="#1D1B17" font-size="20" font-weight="650">
      No visual gain → keep Markdown
    </text>
    <line x1="806" y1="441" x2="806" y2="475" stroke="#B9B1A4"/>
    <text x="834" y="472" fill="#1D1B17" font-size="20" font-weight="650">
      No approval → do not publish
    </text>
  </g>
</svg>
