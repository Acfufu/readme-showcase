<svg xmlns="http://www.w3.org/2000/svg"
     width="1200" height="420" viewBox="0 0 1200 420"
     data-readme-language="en"
     role="img" aria-labelledby="title desc">
  <title id="title">README Showcase</title>
  <desc id="desc">An editorial evidence desk turns repository facts into a verified GitHub homepage and keeps remote publishing locked.</desc>

  <rect width="1200" height="420" rx="26" fill="#F4F0E7"/>
  <rect x="18" y="18" width="1164" height="384" rx="18" fill="none" stroke="#1D1B17" stroke-width="2"/>
  <path d="M640 18V402" stroke="#C9C1B4" stroke-width="2"/>

  <g id="identity" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
    <text x="58" y="66" fill="#6B675F" font-size="18" font-weight="700" letter-spacing="3">CODEX SKILL / EVIDENCE-DRIVEN README</text>
    <text x="58" y="144" fill="#1D1B17" font-size="64" font-weight="800" letter-spacing="-2">README</text>
    <text x="58" y="207" fill="#1D1B17" font-size="64" font-weight="800" letter-spacing="-2">SHOWCASE</text>
    <rect id="title-highlight" x="58" y="232" width="534" height="5" fill="#C84B3C"/>
    <text x="58" y="282" fill="#4C4943" font-size="24">Repository truth → a clear GitHub homepage.</text>

    <g id="command-prompt" transform="translate(58 316)">
      <rect width="534" height="58" rx="8" fill="#1D1B17"/>
      <circle cx="510" cy="29" r="7" fill="#C84B3C"/>
      <text x="24" y="37" fill="#F4F0E7" font-size="20" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">$readme-showcase</text>
    </g>
  </g>

  <g id="evidence-docket" transform="rotate(1 904 202)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
    <rect x="684" y="48" width="452" height="310" rx="8" fill="#FBF8F1" stroke="#1D1B17" stroke-width="2"/>
    <text x="714" y="88" fill="#6B675F" font-size="18" font-weight="700" letter-spacing="2">EVIDENCE FILE / LOCAL RUN</text>
    <path d="M714 108H1106" stroke="#C9C1B4" stroke-width="2"/>

    <g fill="#1D1B17" font-size="21">
      <text x="714" y="151" font-weight="800">01</text>
      <text x="768" y="151">Map repository facts</text>
      <text x="714" y="198" font-weight="800">02</text>
      <text x="768" y="198">Choose story by project type</text>
      <text x="714" y="245" font-weight="800">03</text>
      <text x="768" y="245">Bind every claim to proof</text>
      <text x="714" y="292" font-weight="800">04</text>
      <text x="768" y="292">Verify before local handoff</text>
    </g>

    <g id="verification-stamp" transform="translate(930 300) rotate(-7)">
      <rect x="0" y="0" width="168" height="47" rx="5" fill="#FBF8F1" stroke="#C84B3C" stroke-width="3"/>
      <text x="84" y="31" fill="#C84B3C" font-size="18" font-weight="800" letter-spacing="1" text-anchor="middle">CLAIMS VERIFIED</text>
    </g>
  </g>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="17" font-weight="700">
    <text x="674" y="389" fill="#6B675F">VALUE</text>
    <path d="M730 383H766" stroke="#C84B3C" stroke-width="2"/>
    <text x="782" y="389" fill="#6B675F">PROOF</text>
    <path d="M840 383H876" stroke="#C84B3C" stroke-width="2"/>
    <text x="892" y="389" fill="#6B675F">FIRST USE</text>
    <path d="M984 383H1020" stroke="#C84B3C" stroke-width="2"/>
    <text x="1036" y="389" fill="#2F6B5F">LOCAL ONLY</text>
  </g>
</svg>
