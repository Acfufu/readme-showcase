<svg xmlns="http://www.w3.org/2000/svg"
     width="1200" height="430" viewBox="0 0 1200 430"
     role="img" aria-labelledby="title desc">
  <title id="title">README Showcase</title>
  <desc id="desc">An evidence-driven Codex skill that turns repository facts into clear GitHub homepages.</desc>

  <rect width="1200" height="430" rx="24" fill="#F3EFE5"/>
  <rect x="18" y="18" width="1164" height="394" rx="16"
        fill="none" stroke="#1D1B17" stroke-width="2"/>

  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif">
    <text x="58" y="66" fill="#686257" font-size="18" font-weight="700"
          letter-spacing="3">CODEX SKILL / EVIDENCE-DRIVEN README DESIGN</text>

    <text x="58" y="154" fill="#1D1B17" font-size="68" font-weight="800"
          letter-spacing="-2">README</text>
    <text x="58" y="222" fill="#1D1B17" font-size="68" font-weight="800"
          letter-spacing="-2">SHOWCASE</text>
    <rect id="title-highlight" x="59" y="244" width="548" height="5" fill="#C54A36"/>
    <text x="58" y="292" fill="#4F4A42" font-size="25">
      Repository facts → a clear GitHub homepage.
    </text>

    <g id="command-prompt">
      <rect x="58" y="326" width="548" height="48" rx="5"
            fill="#1D1B17"/>
      <text x="82" y="357" fill="#F3EFE5" font-size="20"
            font-family="ui-monospace, SFMono-Regular, Menlo, monospace">$readme-showcase</text>
      <circle cx="568" cy="350" r="7" fill="#C54A36"/>
    </g>
  </g>

  <g id="evidence-card" transform="translate(690 58) rotate(1 220 148)"
     font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif">
    <rect x="0" y="0" width="444" height="300" rx="6"
          fill="#FFFDF7" stroke="#1D1B17" stroke-width="2"/>
    <line x1="28" y1="60" x2="416" y2="60" stroke="#B9B1A4"/>
    <text x="28" y="38" fill="#686257" font-size="17" font-weight="700"
          letter-spacing="2">EVIDENCE FILE / README-001</text>

    <g font-size="22" fill="#1D1B17">
      <text x="28" y="102" font-weight="700">01</text>
      <text x="82" y="102">Map repository evidence</text>
      <text x="28" y="146" font-weight="700">02</text>
      <text x="82" y="146">Choose narrative by project type</text>
      <text x="28" y="190" font-weight="700">03</text>
      <text x="82" y="190">Use visuals only as proof</text>
      <text x="28" y="234" font-weight="700">04</text>
      <text x="82" y="234">Close with runnable checks</text>
    </g>

    <g transform="translate(267 238) rotate(-7 72 24)">
      <rect x="0" y="0" width="145" height="48" rx="3"
            fill="none" stroke="#C54A36" stroke-width="3"/>
      <text x="72.5" y="30" fill="#C54A36" font-size="17" font-weight="800"
            text-anchor="middle" letter-spacing="1">CLAIMS VERIFIED</text>
    </g>
  </g>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
     font-size="17" font-weight="700" fill="#686257">
    <text x="690" y="390">VALUE</text>
    <line x1="752" y1="384" x2="788" y2="384" stroke="#C54A36" stroke-width="2"/>
    <text x="804" y="390">PROOF</text>
    <line x1="866" y1="384" x2="902" y2="384" stroke="#C54A36" stroke-width="2"/>
    <text x="918" y="390">FIRST USE</text>
    <line x1="1022" y1="384" x2="1058" y2="384" stroke="#C54A36" stroke-width="2"/>
    <text x="1074" y="390">DETAIL</text>
  </g>
</svg>
