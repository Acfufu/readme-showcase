<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
  <title id="title">README Showcase evidence ledger</title><desc id="desc">A local verification console turns repository evidence into a bilingual, reviewable GitHub homepage while remote publishing stays locked.</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#101722"/><stop offset="1" stop-color="#172434"/></linearGradient><pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#8FA1B5" stroke-opacity=".08"/></pattern></defs>
  <rect width="1200" height="520" rx="28" fill="url(#bg)"/><rect width="1200" height="520" rx="28" fill="url(#grid)"/>
  <path d="M48 58h10m-5-5v10" stroke="#17A398" stroke-width="2"/><text x="76" y="65" fill="#AEBCCB" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="17" letter-spacing="2">README SHOWCASE / LOCAL VERIFICATION DESK</text><circle cx="1110" cy="60" r="5" fill="#17A398"/><text x="1125" y="66" fill="#AEBCCB" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="15">READY</text>
  <g id="identity"><text x="64" y="153" fill="#F4F7FA" font-family="Inter,ui-sans-serif,system-ui,sans-serif" font-size="58" font-weight="750" letter-spacing="-2">Evidence in.</text><text x="64" y="220" fill="#F4F7FA" font-family="Inter,ui-sans-serif,system-ui,sans-serif" font-size="58" font-weight="750" letter-spacing="-2">Reviewable homepage out.</text><text x="66" y="267" fill="#AEBCCB" font-family="Inter,ui-sans-serif,system-ui,sans-serif" font-size="20">Repository-native copy, visuals, claims, and local handoff.</text></g>
  <g id="title-highlight"><rect x="65" y="286" width="455" height="6" rx="3" fill="#17A398"/><circle cx="530" cy="289" r="6" fill="#F1B94B"/></g>
  <g id="command-prompt"><rect x="64" y="337" width="544" height="94" rx="14" fill="#0A1018" stroke="#314156" stroke-width="2"/><circle cx="91" cy="363" r="5" fill="#F16D64"/><circle cx="109" cy="363" r="5" fill="#F1B94B"/><circle cx="127" cy="363" r="5" fill="#17A398"/><text x="89" y="405" fill="#17A398" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="18">$</text><text x="113" y="405" fill="#E5EBF1" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="18">npx --yes github:Acfufu/readme-showcase</text></g>
  <g id="evidence-docket"><rect x="670" y="108" width="466" height="340" rx="18" fill="#F4F7FA"/><rect x="670" y="108" width="466" height="58" rx="18" fill="#DCE4EA"/><path d="M670 148h466" stroke="#DCE4EA" stroke-width="36"/><text x="698" y="144" fill="#101722" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="17" font-weight="700" letter-spacing="1.5">CANDIDATE RECEIPT</text><text x="1090" y="144" text-anchor="end" fill="#5F6B7A" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="14">LOCAL</text>
    <g font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="16"><text x="698" y="205" fill="#5F6B7A">DATASET</text><text x="1090" y="205" text-anchor="end" fill="#101722" font-weight="700">20 TRAIN / 2 TEST</text><path d="M698 222h392" stroke="#C9D3DC"/><text x="698" y="258" fill="#5F6B7A">LOCALES</text><text x="1090" y="258" text-anchor="end" fill="#101722" font-weight="700">7 EXPLICIT TAGS</text><path d="M698 275h392" stroke="#C9D3DC"/><text x="698" y="311" fill="#5F6B7A">RUNTIME</text><text x="1090" y="311" text-anchor="end" fill="#101722" font-weight="700">PY 3.11+ / NODE 22.22.3</text><path d="M698 328h392" stroke="#C9D3DC"/><text x="698" y="364" fill="#5F6B7A">ENGINE</text><text x="1090" y="364" text-anchor="end" fill="#101722" font-weight="700">ELK 0.9.3 · PINNED</text></g>
    <g id="verification-stamp"><rect x="698" y="389" width="392" height="39" rx="8" fill="#DDF3EF" stroke="#17A398" stroke-width="2"/><circle cx="721" cy="408" r="8" fill="#17A398"/><path d="m717 408 3 3 6-7" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="740" y="414" fill="#0F6E68" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="15" font-weight="700">LOCAL HANDOFF · REMOTE LOCKED</text></g>
  </g>
  <text x="64" y="482" fill="#77899D" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="14">SCAN → RETRIEVE → DRAFT → VALIDATE → EVALUATE → PREVIEW</text><text x="1136" y="482" text-anchor="end" fill="#F1B94B" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="14">PUBLISH REQUIRES APPROVAL</text>
</svg>
