<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430" role="img" aria-labelledby="title desc" data-readme-language="en">
  <title id="title">README Showcase hard gates</title><desc id="desc">Claims, assets, locale, and fingerprints must pass before local preview; remote publish remains locked behind separate approval.</desc>
  <defs><pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse"><path d="M36 0H0V36" fill="none" stroke="#171713" stroke-opacity=".05"/></pattern></defs><rect width="1200" height="430" rx="28" fill="#F3EFE6"/><rect width="1200" height="430" rx="28" fill="url(#grid)"/>
  <text x="48" y="54" font-family="SFMono-Regular,Menlo,monospace" font-size="15" font-weight="700" letter-spacing="2" fill="#167C72">TRUST GATES</text><text x="1152" y="54" text-anchor="end" font-family="SFMono-Regular,Menlo,monospace" font-size="14" fill="#716E65">PASS ≠ PUBLISH</text><path d="M0 80H1200" stroke="#171713" stroke-width="2"/>
  <text x="48" y="132" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Arial,PingFang SC,sans-serif" font-size="36" font-weight="800" fill="#171713">Every public byte earns its way through.</text>
  <g font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Arial,PingFang SC,sans-serif">
    <g transform="translate(48 174)"><rect width="196" height="150" rx="14" fill="#FFFDF8" stroke="#171713" stroke-width="2"/><text x="20" y="38" font-family="SFMono-Regular,Menlo,monospace" font-size="13" fill="#E65036">GATE 01</text><text x="20" y="78" font-size="25" font-weight="800" fill="#171713">Claims</text><text x="20" y="108" font-size="15" fill="#716E65">Target evidence only</text><circle cx="170" cy="125" r="11" fill="#167C72"/><path d="m165 125 4 4 7-9" fill="none" stroke="#fff" stroke-width="2"/></g>
    <path d="M252 249H296" stroke="#171713" stroke-width="2" stroke-dasharray="6 6"/>
    <g transform="translate(304 174)"><rect width="196" height="150" rx="14" fill="#FFFDF8" stroke="#171713" stroke-width="2"/><text x="20" y="38" font-family="SFMono-Regular,Menlo,monospace" font-size="13" fill="#E65036">GATE 02</text><text x="20" y="78" font-size="25" font-weight="800" fill="#171713">Assets</text><text x="20" y="108" font-size="15" fill="#716E65">Safe + local + hashed</text><circle cx="170" cy="125" r="11" fill="#167C72"/><path d="m165 125 4 4 7-9" fill="none" stroke="#fff" stroke-width="2"/></g>
    <path d="M508 249H552" stroke="#171713" stroke-width="2" stroke-dasharray="6 6"/>
    <g transform="translate(560 174)"><rect width="196" height="150" rx="14" fill="#FFFDF8" stroke="#171713" stroke-width="2"/><text x="20" y="38" font-family="SFMono-Regular,Menlo,monospace" font-size="13" fill="#E65036">GATE 03</text><text x="20" y="78" font-size="25" font-weight="800" fill="#171713">Locale</text><text x="20" y="108" font-size="15" fill="#716E65">Text + asset paired</text><circle cx="170" cy="125" r="11" fill="#167C72"/><path d="m165 125 4 4 7-9" fill="none" stroke="#fff" stroke-width="2"/></g>
    <path d="M764 249H808" stroke="#171713" stroke-width="2" stroke-dasharray="6 6"/>
    <g transform="translate(816 174)"><rect width="196" height="150" rx="14" fill="#171713"/><text x="20" y="38" font-family="SFMono-Regular,Menlo,monospace" font-size="13" fill="#D7F45B">GATE 04</text><text x="20" y="78" font-size="25" font-weight="800" fill="#FFFDF8">Fingerprint</text><text x="20" y="108" font-size="15" fill="#BDB8AE">Exact local handoff</text><circle cx="170" cy="125" r="11" fill="#D7F45B"/><path d="m165 125 4 4 7-9" fill="none" stroke="#171713" stroke-width="2"/></g>
    <path d="M1020 249H1064" stroke="#E65036" stroke-width="2" stroke-dasharray="6 6"/>
    <g transform="translate(1070 183)"><rect width="82" height="132" rx="14" fill="none" stroke="#E65036" stroke-width="2" stroke-dasharray="7 6"/><path d="M1095 232v-8a16 16 0 0 1 32 0v8m-38 0h44v38h-44z" transform="translate(-1070 -183)" fill="none" stroke="#E65036" stroke-width="3"/><text x="41" y="112" text-anchor="middle" font-family="SFMono-Regular,Menlo,monospace" font-size="11" font-weight="700" fill="#E65036">REMOTE</text></g>
  </g>
  <rect x="48" y="354" width="964" height="36" rx="8" fill="#D8EEE9"/><text x="66" y="378" font-family="SFMono-Regular,Menlo,monospace" font-size="13" font-weight="700" fill="#0D6058">PASS → VERIFIED LOCAL PREVIEW</text><text x="1152" y="378" text-anchor="end" font-family="SFMono-Regular,Menlo,monospace" font-size="13" font-weight="700" fill="#E65036">SEPARATE APPROVAL REQUIRED →</text>
</svg>
