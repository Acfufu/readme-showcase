<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430" role="img" aria-labelledby="title desc" data-readme-language="zh">
  <title id="title">README Showcase 硬门禁</title><desc id="desc">声明、资产、语言和指纹必须通过后才能形成本地预览；远端发布仍由独立批准锁定。</desc>
  <defs><pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse"><path d="M36 0H0V36" fill="none" stroke="#171713" stroke-opacity=".05"/></pattern></defs><rect width="1200" height="430" rx="28" fill="#F3EFE6"/><rect width="1200" height="430" rx="28" fill="url(#grid)"/>
  <text x="48" y="54" font-family="SFMono-Regular,Menlo,monospace" font-size="15" font-weight="700" letter-spacing="2" fill="#167C72">信任门禁</text><text x="1152" y="54" text-anchor="end" font-family="SFMono-Regular,Menlo,monospace" font-size="14" fill="#716E65">通过 ≠ 发布</text><path d="M0 80H1200" stroke="#171713" stroke-width="2"/><text x="48" y="132" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Arial,PingFang SC,sans-serif" font-size="36" font-weight="800" fill="#171713">每一个公开字节，都要经过验证。</text>
  <g font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Arial,PingFang SC,sans-serif">
    <g transform="translate(48 174)"><rect width="196" height="150" rx="14" fill="#FFFDF8" stroke="#171713" stroke-width="2"/><text x="20" y="38" font-family="SFMono-Regular,Menlo,monospace" font-size="13" fill="#E65036">门禁 01</text><text x="20" y="78" font-size="25" font-weight="800" fill="#171713">声明</text><text x="20" y="108" font-size="15" fill="#716E65">仅目标仓库证据</text><circle cx="170" cy="125" r="11" fill="#167C72"/><path d="m165 125 4 4 7-9" fill="none" stroke="#fff" stroke-width="2"/></g><path d="M252 249H296" stroke="#171713" stroke-width="2" stroke-dasharray="6 6"/>
    <g transform="translate(304 174)"><rect width="196" height="150" rx="14" fill="#FFFDF8" stroke="#171713" stroke-width="2"/><text x="20" y="38" font-family="SFMono-Regular,Menlo,monospace" font-size="13" fill="#E65036">门禁 02</text><text x="20" y="78" font-size="25" font-weight="800" fill="#171713">资产</text><text x="20" y="108" font-size="15" fill="#716E65">安全 · 本地 · 哈希</text><circle cx="170" cy="125" r="11" fill="#167C72"/><path d="m165 125 4 4 7-9" fill="none" stroke="#fff" stroke-width="2"/></g><path d="M508 249H552" stroke="#171713" stroke-width="2" stroke-dasharray="6 6"/>
    <g transform="translate(560 174)"><rect width="196" height="150" rx="14" fill="#FFFDF8" stroke="#171713" stroke-width="2"/><text x="20" y="38" font-family="SFMono-Regular,Menlo,monospace" font-size="13" fill="#E65036">门禁 03</text><text x="20" y="78" font-size="25" font-weight="800" fill="#171713">语言</text><text x="20" y="108" font-size="15" fill="#716E65">文字与资产配对</text><circle cx="170" cy="125" r="11" fill="#167C72"/><path d="m165 125 4 4 7-9" fill="none" stroke="#fff" stroke-width="2"/></g><path d="M764 249H808" stroke="#171713" stroke-width="2" stroke-dasharray="6 6"/>
    <g transform="translate(816 174)"><rect width="196" height="150" rx="14" fill="#171713"/><text x="20" y="38" font-family="SFMono-Regular,Menlo,monospace" font-size="13" fill="#D7F45B">门禁 04</text><text x="20" y="78" font-size="25" font-weight="800" fill="#FFFDF8">指纹</text><text x="20" y="108" font-size="15" fill="#BDB8AE">精确本地交付</text><circle cx="170" cy="125" r="11" fill="#D7F45B"/><path d="m165 125 4 4 7-9" fill="none" stroke="#171713" stroke-width="2"/></g><path d="M1020 249H1064" stroke="#E65036" stroke-width="2" stroke-dasharray="6 6"/>
    <g transform="translate(1070 183)"><rect width="82" height="132" rx="14" fill="none" stroke="#E65036" stroke-width="2" stroke-dasharray="7 6"/><path d="M25 49v-8a16 16 0 0 1 32 0v8m-38 0h44v38H19z" fill="none" stroke="#E65036" stroke-width="3"/><text x="41" y="112" text-anchor="middle" font-family="SFMono-Regular,Menlo,monospace" font-size="11" font-weight="700" fill="#E65036">远端</text></g>
  </g><rect x="48" y="354" width="964" height="36" rx="8" fill="#D8EEE9"/><text x="66" y="378" font-family="SFMono-Regular,Menlo,monospace" font-size="13" font-weight="700" fill="#0D6058">通过 → 已验证本地预览</text><text x="1152" y="378" text-anchor="end" font-family="SFMono-Regular,Menlo,monospace" font-size="13" font-weight="700" fill="#E65036">另行批准后才能继续 →</text>
</svg>
