<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430" role="img" aria-labelledby="title desc" data-readme-language="zh">
  <title id="title">README Showcase 视觉路线</title><desc id="desc">四种可选视觉路线保留可编辑源文件，并在失败时安全停止于本地预览。</desc>
  <rect width="1200" height="430" rx="28" fill="#F3EFE6"/><text x="48" y="53" font-family="SFMono-Regular,Menlo,monospace" font-size="15" font-weight="700" letter-spacing="2" fill="#E65036">视觉路线</text><text x="1152" y="53" text-anchor="end" font-family="SFMono-Regular,Menlo,monospace" font-size="14" fill="#716E65">按沟通任务选择</text><path d="M0 80H1200" stroke="#171713" stroke-width="2"/><text x="48" y="130" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Arial,PingFang SC,sans-serif" font-size="36" font-weight="800" fill="#171713">不同证据，需要不同几何。</text>
  <g font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Arial,PingFang SC,sans-serif">
    <g transform="translate(48 166)"><rect width="258" height="198" rx="16" fill="#FFFDF8" stroke="#171713" stroke-width="2"/><rect x="18" y="18" width="54" height="54" rx="10" fill="#DDE7FA"/><path d="M31 56h28V33H31zM37 47l7-7 5 5 6-8" fill="none" stroke="#2356B6" stroke-width="3"/><text x="88" y="50" font-size="25" font-weight="800" fill="#171713">static</text><text x="18" y="105" font-size="16" fill="#716E65">项目原生 SVG</text><text x="18" y="132" font-size="16" fill="#716E65">Hero · 紧凑图形</text><text x="18" y="176" font-family="SFMono-Regular,Menlo,monospace" font-size="12" fill="#2356B6">可编辑源文件</text></g>
    <g transform="translate(330 166)"><rect width="258" height="198" rx="16" fill="#FFFDF8" stroke="#171713" stroke-width="2"/><rect x="18" y="18" width="54" height="54" rx="10" fill="#D8EEE9"/><circle cx="45" cy="45" r="15" fill="none" stroke="#167C72" stroke-width="3"/><path d="M30 45h30M45 30v30" stroke="#167C72" stroke-width="2"/><text x="88" y="50" font-size="25" font-weight="800" fill="#171713">ELK</text><text x="18" y="105" font-size="16" fill="#716E65">关系密集正文图</text><text x="18" y="132" font-size="16" fill="#716E65">架构 · 流程 · C4</text><text x="18" y="176" font-family="SFMono-Regular,Menlo,monospace" font-size="12" fill="#167C72">内置哈希校验</text></g>
    <g transform="translate(612 166)"><rect width="258" height="198" rx="16" fill="#171713"/><rect x="18" y="18" width="54" height="54" rx="10" fill="#D7F45B"/><path d="M31 34h28v22H31zM36 39h18M36 45h12M36 51h15" stroke="#171713" stroke-width="2"/><text x="88" y="50" font-size="25" font-weight="800" fill="#FFFDF8">compiled</text><text x="18" y="105" font-size="16" fill="#BDB8AE">Plan v3 投影</text><text x="18" y="132" font-size="16" fill="#BDB8AE">桌面 + 移动场景</text><text x="18" y="176" font-family="SFMono-Regular,Menlo,monospace" font-size="12" fill="#D7F45B">确定性门禁</text></g>
    <g transform="translate(894 166)"><rect width="258" height="198" rx="16" fill="#E65036"/><rect x="18" y="18" width="54" height="54" rx="10" fill="#FFFDF8"/><path d="m39 33 17 12-17 12z" fill="#E65036"/><text x="88" y="50" font-size="25" font-weight="800" fill="#FFFDF8">motion</text><text x="18" y="105" font-size="16" fill="#F9DED8">有意义的状态变化</text><text x="18" y="132" font-size="16" fill="#F9DED8">SVG + JSON → GIF</text><text x="18" y="176" font-family="SFMono-Regular,Menlo,monospace" font-size="12" fill="#FFFDF8">明确选择</text></g>
  </g><text x="48" y="405" font-family="SFMono-Regular,Menlo,monospace" font-size="12" fill="#716E65">引擎失败时保留上一份正确字节</text><text x="1152" y="405" text-anchor="end" font-family="SFMono-Regular,Menlo,monospace" font-size="12" font-weight="700" fill="#E65036">所有路线停在本地</text>
</svg>
