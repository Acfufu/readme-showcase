<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc" data-readme-language="en">
  <title id="title">Project and user installation scopes</title><desc id="desc">The official installer places one verified Skill in either the current repository or the Codex user home, then checks exact bytes.</desc>
  <rect width="1200" height="420" rx="28" fill="#171713"/><text x="48" y="55" font-family="SFMono-Regular,Menlo,monospace" font-size="15" font-weight="700" letter-spacing="2" fill="#D7F45B">INSTALLATION ROUTER</text><text x="1152" y="55" text-anchor="end" font-family="SFMono-Regular,Menlo,monospace" font-size="14" fill="#8F8C84">ATOMIC · IDEMPOTENT · CHECKABLE</text>
  <text x="48" y="116" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Arial,PingFang SC,sans-serif" font-size="38" font-weight="800" fill="#FFFDF8">One installer. Two deliberate scopes.</text>
  <g transform="translate(48 150)"><rect width="516" height="205" rx="18" fill="#F3EFE6"/><circle cx="42" cy="42" r="17" fill="#167C72"/><path d="m34 42 6 6 11-14" fill="none" stroke="#fff" stroke-width="3"/><text x="72" y="48" font-family="SFMono-Regular,Menlo,monospace" font-size="15" font-weight="700" fill="#171713">PROJECT</text><text x="28" y="94" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Arial,PingFang SC,sans-serif" font-size="24" font-weight="800" fill="#171713">Shared with this repository</text><rect x="28" y="118" width="460" height="48" rx="8" fill="#FFFDF8"/><text x="46" y="149" font-family="SFMono-Regular,Menlo,monospace" font-size="17" fill="#2356B6">.agents/skills/readme-showcase</text><text x="28" y="190" font-family="SFMono-Regular,Menlo,monospace" font-size="12" fill="#716E65">--project --yes</text></g>
  <g transform="translate(636 150)"><rect width="516" height="205" rx="18" fill="#FFFDF8"/><circle cx="42" cy="42" r="17" fill="#E65036"/><path d="M34 42h16M42 34v16" stroke="#fff" stroke-width="3"/><text x="72" y="48" font-family="SFMono-Regular,Menlo,monospace" font-size="15" font-weight="700" fill="#171713">USER</text><text x="28" y="94" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Arial,PingFang SC,sans-serif" font-size="24" font-weight="800" fill="#171713">Available across Codex tasks</text><rect x="28" y="118" width="460" height="48" rx="8" fill="#F3EFE6"/><text x="46" y="149" font-family="SFMono-Regular,Menlo,monospace" font-size="17" fill="#A53120">${CODEX_HOME}/skills/readme-showcase</text><text x="28" y="190" font-family="SFMono-Regular,Menlo,monospace" font-size="12" fill="#716E65">--user --yes</text></g>
  <path d="M48 389H1152" stroke="#3A3935"/><text x="48" y="407" font-family="SFMono-Regular,Menlo,monospace" font-size="12" fill="#8F8C84">VALIDATE → LOCK → STAGE → HASH → BACKUP → REPLACE → CHECK</text><text x="1152" y="407" text-anchor="end" font-family="SFMono-Regular,Menlo,monospace" font-size="12" fill="#D7F45B">ROLLBACK ON FAILURE</text>
</svg>
