<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500" viewBox="0 0 1200 500" role="img" aria-labelledby="title desc" data-readme-language="zh">
  <title id="title">README Showcase 命令舱</title><desc id="desc">五条命令分别负责规划、审计、重构、精修和视觉生成，并保持明确的工作边界。</desc>
  <defs><pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#171713" stroke-opacity=".05"/></pattern></defs>
  <rect width="1200" height="500" rx="28" fill="#F3EFE6"/><rect width="1200" height="500" rx="28" fill="url(#grid)"/>
  <circle cx="45" cy="43" r="9" fill="#E65036"/><text x="68" y="50" font-family="SFMono-Regular,Menlo,monospace" font-size="17" font-weight="700" letter-spacing="2" fill="#171713">命令舱</text><text x="1150" y="50" text-anchor="end" font-family="SFMono-Regular,Menlo,monospace" font-size="14" fill="#716E65">一个 Skill · 五种任务</text><path d="M0 82H1200" stroke="#171713" stroke-width="2"/>
  <text x="48" y="139" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Arial,PingFang SC,sans-serif" font-size="38" font-weight="800" fill="#171713">选对任务，守住边界。</text>
  <g font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Arial,PingFang SC,sans-serif">
    <g transform="translate(48 174)"><rect width="208" height="244" rx="16" fill="#171713"/><text x="18" y="42" font-family="SFMono-Regular,Menlo,monospace" font-size="14" fill="#D7F45B">01 · 规划</text><text x="18" y="90" font-size="29" font-weight="800" fill="#FFFDF8">shape</text><text x="18" y="128" font-size="16" fill="#BDB8AE">证据地图</text><text x="18" y="153" font-size="16" fill="#BDB8AE">叙事结构</text><text x="18" y="178" font-size="16" fill="#BDB8AE">视觉方向</text><rect x="18" y="202" width="172" height="27" rx="6" fill="#2A2A26"/><text x="104" y="221" text-anchor="middle" font-family="SFMono-Regular,Menlo,monospace" font-size="12" fill="#D7F45B">等待批准</text></g>
    <g transform="translate(272 174)"><rect width="208" height="244" rx="16" fill="#FFFDF8" stroke="#171713" stroke-width="2"/><text x="18" y="42" font-family="SFMono-Regular,Menlo,monospace" font-size="14" fill="#E65036">02 · 检查</text><text x="18" y="90" font-size="29" font-weight="800" fill="#171713">audit</text><text x="18" y="128" font-size="16" fill="#716E65">声明</text><text x="18" y="153" font-size="16" fill="#716E65">链接与语言</text><text x="18" y="178" font-size="16" fill="#716E65">硬问题</text><rect x="18" y="202" width="172" height="27" rx="6" fill="#F5D7D1"/><text x="104" y="221" text-anchor="middle" font-family="SFMono-Regular,Menlo,monospace" font-size="12" fill="#A53120">只读</text></g>
    <g transform="translate(496 174)"><rect width="208" height="244" rx="16" fill="#167C72"/><text x="18" y="42" font-family="SFMono-Regular,Menlo,monospace" font-size="14" fill="#D8EEE9">03 · 重构</text><text x="18" y="90" font-size="29" font-weight="800" fill="#FFFDF8">redesign</text><text x="18" y="128" font-size="16" fill="#D8EEE9">叙事顺序</text><text x="18" y="153" font-size="16" fill="#D8EEE9">文案与视觉</text><text x="18" y="178" font-size="16" fill="#D8EEE9">硬门禁</text><rect x="18" y="202" width="172" height="27" rx="6" fill="#0D6058"/><text x="104" y="221" text-anchor="middle" font-family="SFMono-Regular,Menlo,monospace" font-size="12" fill="#FFFDF8">本地预览</text></g>
    <g transform="translate(720 174)"><rect width="208" height="244" rx="16" fill="#FFFDF8" stroke="#171713" stroke-width="2"/><text x="18" y="42" font-family="SFMono-Regular,Menlo,monospace" font-size="14" fill="#2356B6">04 · 精修</text><text x="18" y="90" font-size="29" font-weight="800" fill="#171713">polish</text><text x="18" y="128" font-size="16" fill="#716E65">局部范围</text><text x="18" y="153" font-size="16" fill="#716E65">保留身份</text><text x="18" y="178" font-size="16" fill="#716E65">验证差异</text><rect x="18" y="202" width="172" height="27" rx="6" fill="#DDE7FA"/><text x="104" y="221" text-anchor="middle" font-family="SFMono-Regular,Menlo,monospace" font-size="12" fill="#2356B6">不暗改全局</text></g>
    <g transform="translate(944 174)"><rect width="208" height="244" rx="16" fill="#E65036"/><text x="18" y="42" font-family="SFMono-Regular,Menlo,monospace" font-size="14" fill="#FFFDF8">05 · 绘制</text><text x="18" y="90" font-size="29" font-weight="800" fill="#FFFDF8">visualize</text><text x="18" y="128" font-size="16" fill="#F9DED8">Hero 与图表</text><text x="18" y="153" font-size="16" fill="#F9DED8">静态与动效</text><text x="18" y="178" font-size="16" fill="#F9DED8">资产质检</text><rect x="18" y="202" width="172" height="27" rx="6" fill="#C53E27"/><text x="104" y="221" text-anchor="middle" font-family="SFMono-Regular,Menlo,monospace" font-size="12" fill="#FFFDF8">嵌入另行批准</text></g>
  </g>
  <text x="48" y="466" font-family="SFMono-Regular,Menlo,monospace" font-size="13" fill="#716E65">$readme-showcase [命令] [目标]</text><text x="1152" y="466" text-anchor="end" font-family="SFMono-Regular,Menlo,monospace" font-size="13" font-weight="700" fill="#E65036">任何命令都不授予远端权限</text>
</svg>
