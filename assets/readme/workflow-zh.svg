<svg xmlns="http://www.w3.org/2000/svg"
     width="1200" height="500" viewBox="0 0 1200 500"
     data-readme-language="zh"
     role="img" aria-labelledby="title desc">
  <title id="title">README Showcase 证据轨道</title>
  <desc id="desc">仓库证据依次经过扫描、检索、编写、评估与本地交付；远程发布仍需单独批准。</desc>

  <rect width="1200" height="500" rx="28" fill="#F4F7FB"/>
  <rect x="22" y="22" width="1156" height="456" rx="20" fill="#FFFFFF" stroke="#C9D5E3" stroke-width="2"/>

  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif">
    <text x="56" y="68" fill="#52677F" font-size="18" font-weight="800" letter-spacing="2">证据轨道 / 本地流水线</text>
    <text x="56" y="116" fill="#0B1727" font-size="38" font-weight="800">每条公开声明都保留证据来源。</text>
    <rect x="906" y="52" width="238" height="44" rx="22" fill="#FFF1D2"/>
    <text x="1025" y="81" fill="#9A6200" font-size="18" font-weight="800" text-anchor="middle">未批准 · 不推送</text>

    <path d="M112 221H1002" stroke="#9DB0C4" stroke-width="4"/>
    <path d="m992 211 12 10-12 10" fill="none" stroke="#9DB0C4" stroke-width="4"/>

    <g id="stages">
      <g transform="translate(56 174)">
        <circle cx="56" cy="47" r="38" fill="#0B1727"/>
        <text x="56" y="54" fill="#FFFFFF" font-size="22" font-weight="800" text-anchor="middle">01</text>
        <text x="56" y="112" fill="#0B1727" font-size="21" font-weight="800" text-anchor="middle">扫描</text>
        <text x="56" y="139" fill="#52677F" font-size="18" text-anchor="middle">仓库事实</text>
      </g>

      <g transform="translate(266 174)">
        <circle cx="56" cy="47" r="38" fill="#123E3B"/>
        <text x="56" y="54" fill="#FFFFFF" font-size="22" font-weight="800" text-anchor="middle">02</text>
        <text x="56" y="112" fill="#0B1727" font-size="21" font-weight="800" text-anchor="middle">检索</text>
        <text x="56" y="139" fill="#52677F" font-size="18" text-anchor="middle">仅 train 模式</text>
      </g>

      <g transform="translate(476 174)">
        <circle cx="56" cy="47" r="38" fill="#123E3B"/>
        <text x="56" y="54" fill="#FFFFFF" font-size="22" font-weight="800" text-anchor="middle">03</text>
        <text x="56" y="112" fill="#0B1727" font-size="21" font-weight="800" text-anchor="middle">编写</text>
        <text x="56" y="139" fill="#52677F" font-size="18" text-anchor="middle">文案 + 视觉</text>
      </g>

      <g transform="translate(686 174)">
        <circle cx="56" cy="47" r="38" fill="#123E3B"/>
        <text x="56" y="54" fill="#FFFFFF" font-size="22" font-weight="800" text-anchor="middle">04</text>
        <text x="56" y="112" fill="#0B1727" font-size="21" font-weight="800" text-anchor="middle">评估</text>
        <text x="56" y="139" fill="#52677F" font-size="18" text-anchor="middle">声明 + 资产</text>
      </g>

      <g transform="translate(896 174)">
        <circle cx="56" cy="47" r="38" fill="#0B1727"/>
        <text x="56" y="54" fill="#FFFFFF" font-size="22" font-weight="800" text-anchor="middle">05</text>
        <text x="56" y="112" fill="#0B1727" font-size="21" font-weight="800" text-anchor="middle">交付</text>
        <text x="56" y="139" fill="#52677F" font-size="18" text-anchor="middle">带指纹 bundle</text>
      </g>
    </g>

    <g id="artifacts" transform="translate(56 366)">
      <rect width="198" height="72" rx="12" fill="#EDF3F8"/>
      <text x="18" y="30" fill="#52677F" font-size="17" font-weight="700">事实</text>
      <text x="18" y="55" fill="#0B1727" font-size="20" font-weight="800">claim-map.json</text>

      <rect x="216" width="198" height="72" rx="12" fill="#EDF3F8"/>
      <text x="234" y="30" fill="#52677F" font-size="17" font-weight="700">视觉</text>
      <text x="234" y="55" fill="#0B1727" font-size="20" font-weight="800">asset-manifest</text>

      <rect x="432" width="198" height="72" rx="12" fill="#EDF3F8"/>
      <text x="450" y="30" fill="#52677F" font-size="17" font-weight="700">门禁</text>
      <text x="450" y="55" fill="#0B1727" font-size="20" font-weight="800">评估报告</text>

      <rect x="648" width="222" height="72" rx="12" fill="#DDF7F3"/>
      <text x="666" y="30" fill="#39756F" font-size="17" font-weight="700">本地结果</text>
      <text x="666" y="55" fill="#0B1727" font-size="20" font-weight="800">PR bundle · 通过</text>

      <rect x="888" width="200" height="72" rx="12" fill="#FFF1D2"/>
      <text x="906" y="30" fill="#9A6200" font-size="17" font-weight="700">远程写入</text>
      <text x="906" y="55" fill="#6D4700" font-size="20" font-weight="800">另行批准</text>
    </g>
  </g>
</svg>
