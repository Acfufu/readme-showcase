<svg xmlns="http://www.w3.org/2000/svg"
     width="1200" height="420" viewBox="0 0 1200 420"
     data-readme-language="zh"
     role="img" aria-labelledby="title desc">
  <title id="title">README Showcase</title>
  <desc id="desc">编辑证据台把仓库事实整理成经过验证的 GitHub 项目主页，并保持远程发布锁定。</desc>

  <rect width="1200" height="420" rx="26" fill="#F4F0E7"/>
  <rect x="18" y="18" width="1164" height="384" rx="18" fill="none" stroke="#1D1B17" stroke-width="2"/>
  <path d="M640 18V402" stroke="#C9C1B4" stroke-width="2"/>

  <g id="identity" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif">
    <text x="58" y="66" fill="#6B675F" font-size="18" font-weight="700" letter-spacing="3">CODEX SKILL / 证据驱动 README</text>
    <text x="58" y="144" fill="#1D1B17" font-size="64" font-weight="800" letter-spacing="-2">README</text>
    <text x="58" y="207" fill="#1D1B17" font-size="64" font-weight="800" letter-spacing="-2">SHOWCASE</text>
    <rect id="title-highlight" x="58" y="232" width="534" height="5" fill="#C84B3C"/>
    <text x="58" y="282" fill="#4C4943" font-size="24">仓库事实 → 清晰可信的 GitHub 项目主页。</text>

    <g id="command-prompt" transform="translate(58 316)">
      <rect width="534" height="58" rx="8" fill="#1D1B17"/>
      <circle cx="510" cy="29" r="7" fill="#C84B3C"/>
      <text x="24" y="37" fill="#F4F0E7" font-size="20" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">$readme-showcase</text>
    </g>
  </g>

  <g id="evidence-docket" transform="rotate(1 904 202)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif">
    <rect x="684" y="48" width="452" height="310" rx="8" fill="#FBF8F1" stroke="#1D1B17" stroke-width="2"/>
    <text x="714" y="88" fill="#6B675F" font-size="18" font-weight="700" letter-spacing="2">证据档案 / 本地运行</text>
    <path d="M714 108H1106" stroke="#C9C1B4" stroke-width="2"/>

    <g fill="#1D1B17" font-size="21">
      <text x="714" y="151" font-weight="800">01</text>
      <text x="768" y="151">映射仓库事实</text>
      <text x="714" y="198" font-weight="800">02</text>
      <text x="768" y="198">按项目类型选择叙事</text>
      <text x="714" y="245" font-weight="800">03</text>
      <text x="768" y="245">每条声明绑定证据</text>
      <text x="714" y="292" font-weight="800">04</text>
      <text x="768" y="292">本地交付前完成验证</text>
    </g>

    <g id="verification-stamp" transform="translate(930 300) rotate(-7)">
      <rect x="0" y="0" width="168" height="47" rx="5" fill="#FBF8F1" stroke="#C84B3C" stroke-width="3"/>
      <text x="84" y="31" fill="#C84B3C" font-size="19" font-weight="800" letter-spacing="2" text-anchor="middle">声明已验证</text>
    </g>
  </g>

  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" font-size="17" font-weight="700">
    <text x="674" y="389" fill="#6B675F">价值</text>
    <path d="M722 383H758" stroke="#C84B3C" stroke-width="2"/>
    <text x="774" y="389" fill="#6B675F">证明</text>
    <path d="M822 383H858" stroke="#C84B3C" stroke-width="2"/>
    <text x="874" y="389" fill="#6B675F">首次使用</text>
    <path d="M958 383H994" stroke="#C84B3C" stroke-width="2"/>
    <text x="1010" y="389" fill="#2F6B5F">仅本地</text>
  </g>
</svg>
