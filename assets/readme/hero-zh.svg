<svg xmlns="http://www.w3.org/2000/svg"
     width="1200" height="420" viewBox="0 0 1200 420"
     role="img" aria-labelledby="title desc">
  <title id="title">README Showcase</title>
  <desc id="desc">仓库证据进入本地流水线，输出经过验证、可供审查的 GitHub README。</desc>

  <rect width="1200" height="420" rx="28" fill="#07111F"/>
  <path d="M0 332H1200" stroke="#1B2C42" stroke-width="2"/>
  <path d="M650 0V420" stroke="#1B2C42" stroke-width="2"/>

  <g id="identity" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif">
    <g transform="translate(52 42)">
      <rect width="12" height="12" rx="3" fill="#4AD6C8"/>
      <text x="24" y="12" fill="#90A4BC" font-size="18" font-weight="700" letter-spacing="2">CODEX SKILL · 证据流水线</text>
    </g>

    <text x="52" y="132" fill="#F5F8FC" font-size="66" font-weight="800" letter-spacing="-2">README</text>
    <text x="52" y="196" fill="#F5F8FC" font-size="66" font-weight="800" letter-spacing="-2">SHOWCASE</text>
    <text x="52" y="244" fill="#B8C6D8" font-size="24">输入仓库事实，输出可审查主页。</text>

    <g id="invocation" transform="translate(52 278)">
      <rect width="536" height="48" rx="10" fill="#101D2E" stroke="#27405E"/>
      <text x="20" y="31" fill="#4AD6C8" font-size="20" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">$readme-showcase</text>
      <text x="508" y="31" fill="#F2B84B" font-size="20" font-weight="700" text-anchor="end">本地优先</text>
    </g>
  </g>

  <g id="evidence-console" transform="translate(690 42)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif">
    <rect width="458" height="288" rx="18" fill="#0D1929" stroke="#27405E" stroke-width="2"/>
    <text x="24" y="36" fill="#90A4BC" font-size="18" font-weight="700" letter-spacing="1.5">当前仓库</text>
    <rect x="354" y="16" width="80" height="32" rx="16" fill="#123E3B"/>
    <text x="394" y="38" fill="#65E4D7" font-size="17" font-weight="800" text-anchor="middle">就绪</text>

    <g transform="translate(24 72)">
      <rect width="112" height="72" rx="12" fill="#14243A"/>
      <text x="16" y="29" fill="#90A4BC" font-size="17" font-weight="700">扫描结果</text>
      <text x="16" y="56" fill="#F5F8FC" font-size="22" font-weight="800">64 文件</text>
      <path d="M122 36H156" stroke="#4AD6C8" stroke-width="3"/>
      <path d="m148 28 8 8-8 8" fill="none" stroke="#4AD6C8" stroke-width="3"/>

      <rect x="166" width="112" height="72" rx="12" fill="#14243A"/>
      <text x="182" y="29" fill="#90A4BC" font-size="17" font-weight="700">检索结果</text>
      <text x="182" y="56" fill="#F5F8FC" font-size="22" font-weight="800">5 条模式</text>
      <path d="M288 36H322" stroke="#4AD6C8" stroke-width="3"/>
      <path d="m314 28 8 8-8 8" fill="none" stroke="#4AD6C8" stroke-width="3"/>

      <rect x="332" width="78" height="72" rx="12" fill="#123E3B"/>
      <text x="371" y="30" fill="#65E4D7" font-size="17" font-weight="800" text-anchor="middle">门禁</text>
      <text x="371" y="57" fill="#F5F8FC" font-size="22" font-weight="800" text-anchor="middle">通过</text>
    </g>

    <g transform="translate(24 172)">
      <text x="0" y="18" fill="#90A4BC" font-size="17" font-weight="700">输出</text>
      <text x="0" y="52" fill="#F5F8FC" font-size="24" font-weight="750">带指纹 PR bundle</text>
      <rect x="0" y="72" width="410" height="1" fill="#27405E"/>
      <circle cx="8" cy="98" r="6" fill="#F2B84B"/>
      <text x="24" y="104" fill="#F2B84B" font-size="18" font-weight="700">精确批准前禁止远端写入</text>
    </g>
  </g>

  <g id="metadata" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" font-size="18" font-weight="700">
    <text x="52" y="380" fill="#90A4BC">12 条授权模式</text>
    <text x="276" y="380" fill="#90A4BC">默认静态 SVG</text>
    <text x="500" y="380" fill="#4AD6C8">0 次自动远端写入</text>
  </g>
</svg>
